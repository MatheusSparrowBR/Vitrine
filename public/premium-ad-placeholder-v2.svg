<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anuncie sua empresa na VitrineLocal</title>
  <desc id="desc">Espaço Premium disponível para publicidade de empresas locais.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.58" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#dfeaff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2050e8"/>
      <stop offset="1" stop-color="#4e68ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#173a9a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M-40 300C170 210 290 390 570 300S960 40 1240 40V360H-40Z" fill="#d9e9ff" opacity="0.44"/>
  <circle cx="1115" cy="35" r="175" fill="#ffffff" opacity="0.62"/>
  <circle cx="1190" cy="305" r="205" fill="#bfd5ff" opacity="0.28"/>
  <g transform="translate(72 58)">
    <rect width="208" height="42" rx="21" fill="url(#accent)"/>
    <text x="104" y="27" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#fff" letter-spacing="1">ESPAÇO PREMIUM</text>
    <text x="0" y="124" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="800" fill="#102052">Anuncie sua empresa</text>
    <text x="0" y="181" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="800" fill="#2354eb">aqui!</text>
    <text x="0" y="224" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#53678a">Coloque sua marca em destaque na VitrineLocal.</text>
    <rect y="252" width="250" height="50" rx="25" fill="url(#accent)"/>
    <text x="125" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff">Quero anunciar →</text>
  </g>
  <g transform="translate(850 68)" filter="url(#shadow)">
    <rect width="250" height="225" rx="26" fill="#fff"/>
    <image href="/vitrine-local-header-logo.svg" x="22" y="33" width="206" height="158" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
