<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anuncie sua empresa na VitrineLocal</title>
  <desc id="desc">Espaço Premium disponível para publicidade de empresas locais.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f7ff"/><stop offset="0.58" stop-color="#eef1ff"/><stop offset="1" stop-color="#dfe7ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#263ed8"/><stop offset="1" stop-color="#5a6dff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b2d8a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="55" r="180" fill="#fff" opacity="0.5"/>
  <circle cx="1140" cy="300" r="210" fill="#cfd8ff" opacity="0.28"/>
  <g transform="translate(72 64)">
    <rect width="210" height="42" rx="21" fill="url(#accent)"/>
    <text x="105" y="27" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#fff" letter-spacing="1">ESPAÇO PREMIUM</text>
    <text x="0" y="112" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="800" fill="#102052">Anuncie sua empresa</text>
    <text x="0" y="170" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="800" fill="#3048e3">aqui!</text>
    <text x="0" y="213" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#53627f">Coloque sua marca em destaque na VitrineLocal.</text>
    <rect y="245" width="245" height="50" rx="25" fill="url(#accent)"/>
    <text x="122" y="277" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff">Quero anunciar →</text>
  </g>
  <g transform="translate(860 72)" filter="url(#shadow)">
    <rect width="235" height="205" rx="24" fill="#fff"/>
    <image href="/vitrine-local-header-logo.svg" x="28" y="48" width="179" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="117.5" y="143" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#17245b">Sua empresa em destaque</text>
    <text x="117.5" y="169" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6c7892">Alcance clientes da sua cidade</text>
  </g>
</svg>
