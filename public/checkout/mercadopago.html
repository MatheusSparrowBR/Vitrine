<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assinar Pro — VitrineLocal</title><script src="https://sdk.mercadopago.com/js/v2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#102a43;padding:32px 16px}main{max-width:620px;margin:auto;background:#fff;border:1px solid #e1e8f0;border-radius:20px;padding:28px;box-shadow:0 15px 45px rgba(15,35,65,.08)}label{display:grid;gap:7px;font-weight:800;font-size:13px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mpfield,input,select{min-height:44px;border:1px solid #d6dfeb;border-radius:10px;box-sizing:border-box}.mpfield{padding:0 12px}input,select{width:100%;padding:10px 12px;background:#fff}.msg{padding:12px;border-radius:10px;background:#eef6ff;color:#28567f;margin:12px 0;font-size:13px}.error{background:#fff2f2;color:#9e3038}.success{background:#effaf4;color:#17653f}.btn{width:100%;margin-top:12px;border:0;border-radius:11px;padding:14px;background:#1677ff;color:#fff;font-size:15px;font-weight:900}.btn:disabled{opacity:.6}@media(max-width:620px){main{padding:20px}.row{grid-template-columns:1fr}}</style></head><body><main><div style="font-size:12px;font-weight:900;color:#1677ff;letter-spacing:1px">VITRINELOCAL</div><h1 id="title">Assinar Pro</h1><p id="business" style="color:#64748b">Preparando checkout…</p><div id="price" style="font-size:32px;font-weight:900;margin:18px 0"></div><div id="msg" class="msg">Use o cartão de teste do Mercado Pago.</div><form id="mp-checkout-form"><label>Número do cartão<div id="mp-card-number" class="mpfield"></div></label><div class="row"><label>Validade<div id="mp-expiration" class="mpfield"></div></label><label>CVV<div id="mp-security" class="mpfield"></div></label></div><label>Nome no cartão<input id="mp-name"></label><div class="row"><label>Tipo de documento<select id="mp-id-type"></select></label><label>Número do documento<input id="mp-id-number"></label></div><label>E-mail do comprador<input id="mp-email" type="email" readonly></label><button class="btn" id="submit" type="submit">Autorizar assinatura</button></form></main><script>(()=>{const qs=new URLSearchParams(location.search),token=qs.get('token')||'',publicKey='APP_USR-a0dba7c1-7ef3-4796-b90c-136238aa50c4',endpoint='https://swscqihiqmsyntsmuafm.supabase.co/functions/v1/mercadopago-authorize-subscription',msg=document.getElementById('msg'),submit=document.getElementById('submit');function fail(t){msg.className='msg error';msg.textContent=t;submit.disabled=true}if(!token){fail('Sessão de checkout inválida.');return}try{const p=token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(token.split('.')[0].length/4)*4,'='),data=JSON.parse(atob(p));document.getElementById('title').textContent='Assinar '+(data.planName||'Plano');document.getElementById('business').textContent=(data.businessName||'Sua empresa')+' · '+(data.interval==='yearly'?'cobrança anual':'cobrança mensal');document.getElementById('price').textContent=Number(data.amount||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});document.getElementById('mp-email').value=data.payerEmail||'';const mp=new MercadoPago(publicKey,{locale:'pt-BR'});const form=mp.cardForm({amount:String(data.amount||0),iframe:true,form:{id:'mp-checkout-form',cardNumber:{id:'mp-card-number',placeholder:'Número do cartão'},expirationDate:{id:'mp-expiration',placeholder:'MM/AA'},securityCode:{id:'mp-security',placeholder:'CVV'},cardholderName:{id:'mp-name',placeholder:'Nome'},identificationType:{id:'mp-id-type',placeholder:'Tipo'},identificationNumber:{id:'mp-id-number',placeholder:'Documento'},cardholderEmail:{id:'mp-email',placeholder:'E-mail'}},callbacks:{onSubmit:async()=>{const f=form.getCardFormData();if(!f.token){fail('Não foi possível gerar o token do cartão.');return}submit.disabled=true;submit.textContent='Processando…';msg.className='msg';msg.textContent='Autorizando assinatura…';try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({checkout_token:token,card_token_id:f.token,cardholder_email:f.cardholderEmail,identification_type:f.identificationType,identification_number:f.identificationNumber})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Não foi possível autorizar a assinatura.');msg.className='msg success';msg.textContent='Assinatura autorizada. Redirecionando…';location.href=j.return_url||'/planos?checkout=success'}catch(e){msg.className='msg error';msg.textContent=e.message||'Falha ao autorizar a assinatura.';submit.disabled=false;submit.textContent='Autorizar assinatura'}}}})}catch(e){fail(e.message||'Erro ao carregar o checkout.')}})()</script></body></html>
