name: Apply promotion UX patch once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch promotion UX and media fitting
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          touched=[]

          def write_if_changed(path,text):
              p=root/path
              old=p.read_text(encoding='utf-8') if p.exists() else ''
              if old!=text:
                  p.write_text(text,encoding='utf-8')
                  touched.append(str(path))

          # 1) Global media treatment: preserve complete user-uploaded images/videos in cards.
          css='''/* VitrineLocal — media fitting rules */\n/* User-uploaded media is shown completely; decorative backgrounds may still crop. */\n.business-cover-image,\n.business-logo,\n.profile-logo img,\n.profile-cover > img,\n.account-overview-cover > img,\n.account-overview-brand img,\n.profile-gallery img,\n.profile-gallery video,\n.item-card > img,\n.item-card img,\n.mbp-gallery-main img,\n.mbp-gallery-thumb img,\n.mbp-items img,\n.mbp-promo-card img,\n.promotion-card > img,\n.promotion-default-image,\n.promotion-cover img {\n  object-fit: contain !important;\n  object-position: center !important;\n  background: #eef4fa;\n}\n.business-cover-image, .profile-cover > img, .account-overview-cover > img, .mbp-gallery-main img, .promotion-card > img, .promotion-default-image {\n  width: 100%;\n  height: 100%;\n}\n.business-logo { max-width: 100%; max-height: 100%; }\n.profile-logo img, .account-overview-brand img { max-width: 100%; max-height: 100%; }\n.mbp-gallery-main img, .mbp-gallery-thumb img { display:block; }\n.promotion-card > img, .promotion-default-image {\n  aspect-ratio: 16 / 9;\n  display: block;\n  width: 100%;\n  height: auto;\n  min-height: 190px;\n}\n.vl-promotion-form-card {\n  margin: 18px 0 0; padding: 22px; border: 1px solid #dbe6f1; border-radius: 22px;\n  background: #fff; box-shadow: 0 14px 34px rgba(16,48,81,.07);\n}\n.vl-promotion-form-card h3 { margin:0 0 5px; color:#09294d; font-size:20px; }\n.vl-promotion-form-card > p { margin:0 0 18px; color:#71859b; font-size:12px; line-height:1.5; }\n.vl-promotion-form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }\n.vl-promotion-form-grid label { display:flex; flex-direction:column; gap:7px; color:#36516c; font-size:11px; font-weight:800; }\n.vl-promotion-form-grid .full { grid-column:1/-1; }\n.vl-promotion-form-card input, .vl-promotion-form-card textarea { width:100%; box-sizing:border-box; border:1px solid #d5e1ec; border-radius:12px; padding:11px 12px; color:#09294d; background:#fff; outline:none; font:inherit; }\n.vl-promotion-form-card textarea { min-height:92px; resize:vertical; }\n.vl-promotion-form-card input:focus, .vl-promotion-form-card textarea:focus { border-color:#5ba4ff; box-shadow:0 0 0 3px rgba(33,109,243,.09); }\n.vl-promotion-upload { display:grid; grid-template-columns: minmax(0,1fr) 160px; gap:12px; align-items:center; }\n.vl-promotion-upload-preview { width:160px; aspect-ratio:16/9; object-fit:contain; background:#eef4fa; border:1px solid #dbe6f1; border-radius:12px; }\n.vl-promotion-time-note { grid-column:1/-1; padding:10px 12px; border-radius:11px; background:#f4f8fc; color:#6f8499; font-size:10px; line-height:1.5; }\n.vl-promotion-form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }\n.vl-promotion-form-actions button { min-height:42px; padding:0 16px; border-radius:12px; border:1px solid #d6e2ed; background:#fff; color:#39536c; font-weight:900; cursor:pointer; }\n.vl-promotion-form-actions .primary { border-color:#216df3; background:#216df3; color:#fff; }\n@media(max-width:760px){ .vl-promotion-form-grid{grid-template-columns:1fr;} .vl-promotion-form-grid .full{grid-column:auto;} .vl-promotion-upload{grid-template-columns:1fr;} .vl-promotion-upload-preview{width:100%;} }\n'''
          write_if_changed('src/promotion-ux-v2.css',css)

          # 2) Load the new CSS globally.
          app=root/'src/app-entry.jsx'
          text=app.read_text(encoding='utf-8')
          if "./promotion-ux-v2.css" not in text:
              text=text.replace("import './phase2-product.css'", "import './phase2-product.css'\nimport './promotion-ux-v2.css'")
              app.write_text(text,encoding='utf-8'); touched.append('src/app-entry.jsx')

          # 3) Fixed Brazil timezone in admin editor/list and UTC storage.
          admin=root/'src/admin-tools.jsx'
          text=admin.read_text(encoding='utf-8')
          text=text.replace(
              "const emptyPromotion={business_id:'',title:'',description:'',price:'',original_price:'',starts_at:'',ends_at:'',status:'pending_review'}",
              "const emptyPromotion={business_id:'',title:'',description:'',price:'',original_price:'',starts_at:'',ends_at:'',status:'pending_review',image_url:''}"
          )
          old="const when=v=>v?new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Sem período'\nconst dateInput=v=>v?new Date(v).toISOString().slice(0,16):''"
          new="const PROMOTION_TIME_ZONE='America/Sao_Paulo'\nconst when=v=>v?new Intl.DateTimeFormat('pt-BR',{timeZone:PROMOTION_TIME_ZONE,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v)):'Sem período'\nconst dateInput=v=>{if(!v)return '';const d=new Date(v);if(!Number.isFinite(d.getTime()))return '';return new Intl.DateTimeFormat('sv-SE',{timeZone:PROMOTION_TIME_ZONE,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d).replace(' ','T')}\nconst promotionToIso=v=>v?new Date(`${v}:00-03:00`).toISOString():null"
          if old not in text: raise SystemExit('admin timezone helpers pattern not found')
          text=text.replace(old,new)
          text=text.replace("promotions').select('id,business_id,title,description,price,original_price,starts_at,ends_at,status,created_at,updated_at,businesses", "promotions').select('id,business_id,title,description,image_url,price,original_price,starts_at,ends_at,status,created_at,updated_at,businesses")
          text=text.replace(
              "setForm({business_id:row.business_id||'',title:row.title||'',description:row.description||'',price:row.price??'',original_price:row.original_price??'',starts_at:dateInput(row.starts_at),ends_at:dateInput(row.ends_at),status:row.status||'pending_review'})",
              "setForm({business_id:row.business_id||'',title:row.title||'',description:row.description||'',price:row.price??'',original_price:row.original_price??'',starts_at:dateInput(row.starts_at),ends_at:dateInput(row.ends_at),status:row.status||'pending_review',image_url:row.image_url||''})"
          )
          text=text.replace(
              "starts_at:form.starts_at?new Date(form.starts_at).toISOString():null,ends_at:form.ends_at?new Date(form.ends_at).toISOString():null,status:form.status,updated_at:new Date().toISOString()",
              "starts_at:promotionToIso(form.starts_at),ends_at:promotionToIso(form.ends_at),status:form.status,image_url:String(form.image_url||'').trim()||null,updated_at:new Date().toISOString()"
          )
          admin.write_text(text,encoding='utf-8'); touched.append('src/admin-tools.jsx')

          # 4) Owner promotion creation: replace prompt-only flow with a real inline form and image upload.
          acct=root/'src/AccountPage.jsx'
          text=acct.read_text(encoding='utf-8')
          old_start="async function addPromotion(){if(!db||!selected)return;const title=window.prompt('Título da promoção');if(!title?.trim())return;const description=window.prompt('Descrição')||null;const priceInput=window.prompt('Preço promocional (opcional)');const price=priceInput?Number(priceInput.replace(',','.')):null;const{error}=await db.from('promotions').insert({business_id:selected.id,title:title.trim(),description,price:Number.isFinite(price)?price:null,status:'pending_review'});if(error)return notify(error.message,true);notify('Promoção enviada para revisão.');await loadBusiness(selected.id)}"
          new_fn=r'''async function addPromotion(){
 if(!db||!selected)return
 const sections=[...document.querySelectorAll('.account-content .account-section')]
 const host=sections.find(el=>(el.querySelector('h1,h2')?.textContent||'').toLowerCase().includes('promoções'))||sections.find(el=>el.textContent.toLowerCase().includes('promoções'))
 if(!host)return notify('Não foi possível abrir o formulário de promoção.',true)
 const existing=host.querySelector('[data-vl-promotion-form]')
 if(existing){existing.scrollIntoView({behavior:'smooth',block:'center'});return}
 const timeZoneLabel='Horário local de Brasília (America/Sao_Paulo)'
 const formEl=document.createElement('form')
 formEl.dataset.vlPromotionForm='1'
 formEl.className='vl-promotion-form-card'
 formEl.innerHTML=`
  <h3>Nova promoção</h3>
  <p>Preencha os dados da oferta. Ela será enviada para revisão antes de aparecer publicamente.</p>
  <div class="vl-promotion-form-grid">
   <label class="full">Título da promoção<input name="title" maxlength="100" required placeholder="Ex.: 20% OFF em todos os pratos" /></label>
   <label class="full">Descrição<textarea name="description" maxlength="500" placeholder="Explique a oferta, condições ou detalhes importantes."></textarea></label>
   <label>Preço original (opcional)<input name="original_price" inputmode="decimal" placeholder="R$ 0,00" /></label>
   <label>Preço promocional (opcional)<input name="price" inputmode="decimal" placeholder="R$ 0,00" /></label>
   <label>Começa em (opcional)<input type="datetime-local" name="starts_at" /></label>
   <label>Termina em (opcional)<input type="datetime-local" name="ends_at" /></label>
   <div class="vl-promotion-time-note">⏱ ${timeZoneLabel}. O horário informado será gravado em UTC sem alterar o horário escolhido.</div>
   <label class="full">Imagem da promoção (opcional)
    <div class="vl-promotion-upload"><input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif"/><div data-vl-promo-preview-wrap></div></div>
   </label>
  </div>
  <div class="vl-promotion-form-actions"><button type="button" data-vl-promo-cancel>Cancelar</button><button type="submit" class="primary">Enviar promoção</button></div>`
 host.prepend(formEl)
 const fileInput=formEl.querySelector('input[name="image"]')
 const previewWrap=formEl.querySelector('[data-vl-promo-preview-wrap]')
 const cancel=formEl.querySelector('[data-vl-promo-cancel]')
 const fileState={file:null}
 fileInput.addEventListener('change',()=>{
   fileState.file=fileInput.files?.[0]||null
   previewWrap.replaceChildren()
   if(fileState.file){
    if(!IMAGE_TYPES.has(fileState.file.type)||fileState.file.size>10*1024*1024){notify('Use JPG, PNG, WEBP ou GIF de até 10 MB.',true);fileInput.value='';fileState.file=null;return}
    const img=document.createElement('img');img.className='vl-promotion-upload-preview';img.alt='Pré-visualização da promoção';img.src=URL.createObjectURL(fileState.file);previewWrap.appendChild(img)
   }
 })
 cancel.addEventListener('click',()=>formEl.remove())
 formEl.addEventListener('submit',async e=>{
  e.preventDefault()
  const submit=formEl.querySelector('button[type="submit"]');submit.disabled=true;submit.textContent='Enviando…'
  let uploadedPath=null
  try{
   const fd=new FormData(formEl)
   const title=String(fd.get('title')||'').trim()
   const description=String(fd.get('description')||'').trim()||null
   const originalRaw=String(fd.get('original_price')||'').trim().replace(/[^0-9,.-]/g,'').replace(',','.')
   const priceRaw=String(fd.get('price')||'').trim().replace(/[^0-9,.-]/g,'').replace(',','.')
   const originalPrice=originalRaw?Number(originalRaw):null
   const price=priceRaw?Number(priceRaw):null
   const startsAt=String(fd.get('starts_at')||'')
   const endsAt=String(fd.get('ends_at')||'')
   const toIso=v=>v?new Date(`${v}:00-03:00`).toISOString():null
   if(!title)throw new Error('Informe o título da promoção.')
   if(startsAt&&endsAt&&toIso(endsAt)<=toIso(startsAt))throw new Error('O fim da promoção deve ser depois do início.')
   if(originalPrice!==null&&!Number.isFinite(originalPrice))throw new Error('Preço original inválido.')
   if(price!==null&&!Number.isFinite(price))throw new Error('Preço promocional inválido.')
   let imageUrl=null
   const file=fileState.file
   if(file){
    const ext={ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif' }[file.type]||'bin'
    uploadedPath=`${selected.id}/promotions/${crypto.randomUUID()}.${ext}`
    const upload=await db.storage.from(MEDIA_BUCKET).upload(uploadedPath,file,{cacheControl:'31536000',contentType:file.type,upsert:false})
    if(upload.error)throw upload.error
    imageUrl=db.storage.from(MEDIA_BUCKET).getPublicUrl(uploadedPath).data.publicUrl
   }
   const {error}=await db.from('promotions').insert({business_id:selected.id,title,description,price,original_price:originalPrice,starts_at:toIso(startsAt),ends_at:toIso(endsAt),status:'pending_review',image_url:imageUrl})
   if(error)throw error
   notify('Promoção enviada para revisão.')
   formEl.remove()
   await loadBusiness(selected.id)
  }catch(err){
   if(uploadedPath)await db.storage.from(MEDIA_BUCKET).remove([uploadedPath]).catch(()=>{})
   notify(err?.message||'Não foi possível criar a promoção.',true)
   submit.disabled=false;submit.textContent='Enviar promoção'
  }
 })
 formEl.scrollIntoView({behavior:'smooth',block:'center'})
}'''
          if old_start not in text: raise SystemExit('owner addPromotion prompt function not found')
          text=text.replace(old_start,new_fn)
          acct.write_text(text,encoding='utf-8'); touched.append('src/AccountPage.jsx')

          # 5) Phase2 fallback should use the uploaded default image path selected by the product design.
          phase=root/'src/phase2-enhancements.js'
          text=phase.read_text(encoding='utf-8')
          text=text.replace("const DEFAULT_PROMOTION_IMAGE = '/promotion-default.svg'", "const DEFAULT_PROMOTION_IMAGE = '/promotion-default.png'")
          phase.write_text(text,encoding='utf-8'); touched.append('src/phase2-enhancements.js')

          # 6) Unit assertions for the new behavior.
          test=root/'tests/unit/promotion-form-timezone.test.mjs'
          test_text='''import {test} from 'node:test'\nimport assert from 'node:assert/strict'\nimport fs from 'node:fs'\n\nconst account=fs.readFileSync('src/AccountPage.jsx','utf8')\nconst admin=fs.readFileSync('src/admin-tools.jsx','utf8')\nconst phase=fs.readFileSync('src/phase2-enhancements.js','utf8')\n\ntest('owner promotion creation uses a real form and optional image upload',()=>{\n  assert.match(account,/data-vl-promotion-form/)\n  assert.match(account,/type="datetime-local" name="starts_at"/)\n  assert.match(account,/type="file" name="image"/)\n  assert.match(account,/db\.storage\.from\(MEDIA_BUCKET\)\.upload/)\n})\n\ntest('promotion dates use Sao Paulo timezone consistently',()=>{\n  assert.match(account,/America\\/Sao_Paulo/)\n  assert.match(account,/new Date\\(`\\$\\{v\\}:00-03:00`\\)/)\n  assert.match(admin,/PROMOTION_TIME_ZONE='America\\/Sao_Paulo'/)\n  assert.match(admin,/promotionToIso\\(form\.starts_at\\)/)\n  assert.match(admin,/dateInput=v=>/)\n})\n\ntest('public fallback points at the product default artwork',()=>{\n  assert.match(phase,/DEFAULT_PROMOTION_IMAGE = '\\/promotion-default\\.png'/)\n})\n'''
          write_if_changed('tests/unit/promotion-form-timezone.test.mjs',test_text)

          if touched:
              print('Patched:',', '.join(sorted(set(touched))))
          else:
              print('Already patched')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/promotion-ux-v2.css src/app-entry.jsx src/admin-tools.jsx src/AccountPage.jsx src/phase2-enhancements.js tests/unit/promotion-form-timezone.test.mjs
          git commit -m 'feat: improve promotion scheduling and media uploads'
          git push
